<title>Holiday Availability</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Palette: Dragonara red (#ac2624, from the logo) on near-black / warm white.
   Layout: single mobile column — unlock card, then month header, status summary, 7-column calendar, day detail */
:root{
  --bg:#f4f3f0; --surface:#ffffff; --ink:#17151b; --muted:#6c6772; --line:#e3e0da;
  --accent:#ac2624; --accent-ink:#ffffff;
  --ok:#1d7656; --ok-bg:#e0f1e8; --warn:#8a6410; --warn-bg:#f7ecce;
  --full:#9b1b34; --full-bg:#f7e0e5; --block:#5b5661; --block-bg:#e9e7eb;
  --display:"Sora",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0d10; --surface:#18161b; --ink:#f2eee6; --muted:#a49ea8; --line:#2c2930;
  --accent:#e2564c; --accent-ink:#ffffff;
  --ok:#5fcf9f; --ok-bg:#12291f; --warn:#e8c268; --warn-bg:#2e2513;
  --full:#f0889b; --full-bg:#34141c; --block:#b6b0b9; --block-bg:#262329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0d10; --surface:#18161b; --ink:#f2eee6; --muted:#a49ea8; --line:#2c2930;
  --accent:#e2564c; --accent-ink:#ffffff;
  --ok:#5fcf9f; --ok-bg:#12291f; --warn:#e8c268; --warn-bg:#2e2513;
  --full:#f0889b; --full-bg:#34141c; --block:#b6b0b9; --block-bg:#262329; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.muted{color:var(--muted)}
/* unlock */
form{display:grid;gap:10px}
label{font-weight:600}
select{width:100%;font:500 16px var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=password],input[type=text]{width:100%;font:16px var(--mono);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
select:focus-visible,input:focus-visible,button:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 15px var(--body);border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.switch{flex:none;font-size:.85rem;padding:9px 14px;background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
button.ghost{background:transparent;color:var(--accent);padding:6px 8px}
.err{color:var(--full);font-size:.9rem;margin:0}
.demo{font-size:.82rem;border-top:1px dashed var(--line);padding-top:10px;margin:0}
.demo code{font-family:var(--mono);background:var(--bg);padding:2px 6px;border-radius:6px}
/* header */
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;flex:none;display:block}
.brandname{font:600 .95rem var(--display);letter-spacing:.02em;color:var(--accent)}
.top{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--accent)}
.updated{font-size:.82rem;color:var(--muted);margin:-6px 0 0}
.updated b{color:var(--ink);font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav h2{font-size:1.15rem;font-weight:600}
.nav button{background:var(--surface);color:var(--ink);border:1px solid var(--line);width:44px;height:44px;padding:0;font-size:1.2rem}
.nav button:disabled{opacity:.35;cursor:default}
.rule{font-size:.88rem;margin:0;color:var(--muted)}
.rule b{color:var(--ink)}
/* summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pill{border-radius:10px;padding:8px 6px;text-align:center;font-size:.72rem;font-weight:600;line-height:1.2}
.pill span{display:block;font:500 1.15rem var(--mono);margin-bottom:2px}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-warn{background:var(--warn-bg);color:var(--warn)}
.s-full{background:var(--full-bg);color:var(--full)} .s-block{background:var(--block-bg);color:var(--block)}
/* calendar */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-size:.7rem;text-align:center;color:var(--muted);font-weight:600;letter-spacing:.04em;padding-bottom:2px}
.day{aspect-ratio:1/1.05;max-width:100%;border-radius:9px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-variant-numeric:tabular-nums;padding:2px;background:none;color:inherit;font-family:var(--body)}
.day .n{font-size:.72rem;opacity:.85}
.day .p{font:500 1.05rem var(--mono);line-height:1}
.day.ok{background:var(--ok-bg);color:var(--ok)}
.day.warn{background:var(--warn-bg);color:var(--warn)}
.day.full{background:var(--full-bg);color:var(--full)}
.day.block{background:repeating-linear-gradient(135deg,var(--block-bg) 0 6px,transparent 6px 10px);color:var(--block);border-color:var(--block-bg)}
.day.past{opacity:.35;cursor:default}
.day.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.day.today .n{font-weight:700;text-decoration:underline}
.blank{aspect-ratio:1/1.05}
.detail{display:flex;gap:12px;align-items:center}
.detail .badge{flex:none;min-width:52px;text-align:center;border-radius:10px;padding:8px;font:500 1.3rem var(--mono)}
.detail p{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.note{font-size:.82rem;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:500 .85rem var(--body)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.glist{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.glist li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.glist .tag{font-weight:600;border-radius:6px;padding:1px 8px;white-space:nowrap}
details{font-size:.85rem}
summary{cursor:pointer;color:var(--muted);font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.day{transition:transform .12s}.day:not(.past):active{transform:scale(.94)}}
</style>

  <section class="card" id="gate" style="display:grid;gap:10px">
    <label for="dept">Your department</label>

        <li><span class="sw" style="background:var(--ok-bg);border:1px solid var(--ok)"></span>Available</li>
        <li><span class="sw" style="background:var(--warn-bg);border:1px solid var(--warn)"></span>Last place</li>
        <li><span class="sw" style="background:var(--full-bg);border:1px solid var(--full)"></span>Full</li>
        <li><span class="sw" style="background:repeating-linear-gradient(135deg,var(--block-bg) 0 3px,transparent 3px 5px);border:1px solid var(--block)"></span>Leave blocked</li>
      </ul>
    </section>

    <section class="card" id="detail" aria-live="polite"></section>

    <p class="note">This page is for checking only.</p>

    
  </main>
</div>

<script>
const DEPTS = __DATA__;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DOWLONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const $ = id => document.getElementById(id);
let data = null, keys = [], idx = 0, sel = null, grp = null;
const TODAY = new Date(); const todayKey = TODAY.getFullYear()*10000 + (TODAY.getMonth()+1)*100 + TODAY.getDate();
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

function info(mk, d, g){
  const m = data.months[mk];
  if (!m) return {cls:"block", left:null, label:"No data"};
  if (m.blocked.includes(d)) return {cls:"block", left:null, label:"Leave blocked"};
  const G = m.groups[g]; if (!G) return {cls:"block", left:null, label:"No data"};
  const left = Math.max(0, G.limit - G.booked[d-1]);
  if (left === 0) return {cls:"full", left, limit:G.limit, label:"Full"};
  if (left === 1 && G.limit > 1) return {cls:"warn", left, limit:G.limit, label:"Last free place"};
  return {cls:"ok", left, limit:G.limit, label: left === 1 ? "1 free place" : left + " free places"};
}
const label = id => (data.groups.find(x => x.id === id) || {label:id}).label;

function renderChips(){
  const box = $("chips"); box.innerHTML = "";
  $("groupbox").hidden = data.groups.length < 2;
  data.groups.forEach(g => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = g.label;
    b.setAttribute("aria-pressed", g.id === grp);
    b.onclick = () => { grp = g.id; store.set("ha-group-" + data.dept, grp); renderChips(); render(); };
    box.appendChild(b);
  });
}

function render(){
  const mk = keys[idx]; const [y, mo] = mk.split("-").map(Number);
  const ndays = new Date(y, mo, 0).getDate();
  $("month").textContent = MONTHS[mo-1] + " " + y;
  $("prev").disabled = idx === 0; $("next").disabled = idx === keys.length - 1;
  const G = data.months[mk].groups[grp];
  $("rule").innerHTML = (data.groups.length > 1 ? "<b>" + label(grp) + "</b>: " : "") + "maximum <b>" + (G ? G.limit : "–") + "</b> on leave on the same day. The number on each day is the places still free.";
  const g = $("grid"); g.innerHTML = "";
  DOW.forEach(d => { const e = document.createElement("div"); e.className = "dow"; e.textContent = d; g.appendChild(e); });
  const offset = (new Date(y, mo-1, 1).getDay() + 6) % 7;
  for (let i = 0; i < offset; i++){ const e = document.createElement("div"); e.className = "blank"; g.appendChild(e); }
  for (let d = 1; d <= ndays; d++){
    const it = info(mk, d, grp); const k = y*10000 + mo*100 + d; const past = k < todayKey;
    const b = document.createElement("button");
    b.className = "day " + it.cls + (past ? " past" : "") + (k === todayKey ? " today" : "") + (sel === k ? " sel" : "");
    b.setAttribute("aria-label", MONTHS[mo-1] + " " + d + ": " + it.label);
    b.innerHTML = '<span class="n">' + d + '</span><span class="p">' + (it.left === null ? "×" : it.left) + "</span>";
    if (past) b.disabled = true; else b.onclick = () => { sel = k; render(); };
    g.appendChild(b);
  }
  if (sel && Math.floor(sel/100) === y*100 + mo) showDetail(y, mo, sel % 100);
  else {
    let first = null; for (let d=1; d<=ndays && !first; d++){ if (y*10000+mo*100+d < todayKey) continue; const it = info(mk,d,grp); if (it.cls==="ok"||it.cls==="warn") first = d; }
    $("detail").innerHTML = '<p class="muted" style="margin:0">Tap a day for details.' + (first ? " First free day this month: <b>" + MONTHS[mo-1] + " " + first + "</b>." : " No free days this month.") + "</p>";
  }
}
function showDetail(y, mo, d){
  const mk = y + "-" + String(mo).padStart(2,"0"); const it = info(mk, d, grp); const dt = new Date(y, mo-1, d);
  let html = '<div class="detail"><div class="badge day ' + it.cls + '" style="aspect-ratio:auto">' + (it.left === null ? "×" : it.left) + '</div><p><b>' +
    DOWLONG[dt.getDay()] + " " + d + " " + MONTHS[mo-1] + "</b><br>" + it.label + (it.limit ? ' <span class="muted">· max ' + it.limit + "</span>" : "") + "</p></div>";
  if (data.groups.length > 1 && it.left !== null || data.groups.length > 1 && it.label !== "Ferie bloccate"){
    html += '<ul class="glist">' + data.groups.map(gr => { const x = info(mk, d, gr.id);
      return '<li><span>' + gr.label + '</span><span class="tag s-' + (x.cls==="ok"?"ok":x.cls) + '">' + x.label + "</span></li>"; }).join("") + "</ul>";
  }
  $("detail").innerHTML = html;
}

function openDept(name){
  data = DEPTS.find(d => d.dept === name); if (!data) return;
  store.set("ha-dept", name);
  keys = Object.keys(data.months).sort();
  const now = TODAY.getFullYear() + "-" + String(TODAY.getMonth()+1).padStart(2,"0");
  idx = Math.max(0, keys.indexOf(now)); sel = null;
  const saved = store.get("ha-group-" + data.dept);
  grp = data.groups.some(g => g.id === saved) ? saved : data.groups[0].id;
  const u = new Date(data.updated);
  $("updated").innerHTML = "<b>" + data.dept + "</b> · Updated " + u.toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"}) + " at " + u.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
  $("updated").hidden = false; $("gate").hidden = true; $("app").hidden = false; $("lock").hidden = false;
  renderChips(); render();
}
DEPTS.forEach(d => { const o = document.createElement("option"); o.value = d.dept; o.textContent = d.dept; $("dept").appendChild(o); });
$("dept").onchange = e => openDept(e.target.value);
$("prev").onclick = () => { if (idx > 0){ idx--; sel = null; render(); } };
$("next").onclick = () => { if (idx < keys.length-1){ idx++; sel = null; render(); } };
$("lock").onclick = () => { data = null; $("app").hidden = true; $("gate").hidden = false; $("lock").hidden = true; $("updated").hidden = true; $("dept").value = ""; };
const last = store.get("ha-dept"); if (last && DEPTS.some(d => d.dept === last)) { $("dept").value = last; openDept(last); }
</script>
